# XcodeGen spec. Generate the Xcode project with: xcodegen generate
name: PhotoSwipe
options:
  bundleIdPrefix: com.warrenlimzf
  deploymentTarget:
    iOS: "17.0"
packages:
  PhotoSwipe:
    path: .
targets:
  PhotoSwipe:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: PhotoSwipe
        product: PhotoSwipeUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.warrenlimzf.photoswipe
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Photo Swipe
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Photo Swipe shows your photos one at a time so you can choose which to keep and which to delete. Nothing leaves your phone.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
